[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-hooks"
version = "0.1.0a1"
description = "Framework-neutral agent lifecycle hook contract: hook points, context, verdict, and conformance test kit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Responsible AI", email = "responsibleai@microsoft.com" }]
keywords = ["ai-agents", "governance", "hooks", "lifecycle", "conformance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
ctk = ["jsonschema>=4.21", "pytest>=7.4"]
dev = ["agent-hooks[ctk]", "mypy>=1.8", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/responsibleai/agent-hooks"
Specification = "https://github.com/responsibleai/agent-hooks/blob/main/spec/AGENT-HOOKS-0.1.md"

[project.entry-points.pytest11]
agent_hooks_ctk = "agent_hooks.ctk.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_hooks"]

[tool.hatch.build.targets.wheel.shared-data]
"src/agent_hooks/schema" = "agent_hooks/schema"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF", "BLE"]
ignore = [
  "RUF002",  # en-dash in docstrings is intentional (spec section ranges)
]

[tool.mypy]
strict = true
warn_unreachable = true
