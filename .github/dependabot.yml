# Supply chain: automated dependency updates across all six ecosystems.
# Grouped weekly to keep PR volume reviewable; security updates are
# always opened immediately regardless of schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  # The three cargo roots path-depend on the same core crate, so their
  # lockfiles must move together: a per-directory bump leaves the
  # sibling Cargo.locks stale and CI's --locked rejects the PR. One
  # multi-directory entry produces a single PR updating all three.
  - package-ecosystem: cargo
    directories:
      - /sdk/rust
      - /sdk/python
      - /sdk/typescript
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: /sdk/python
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /sdk/typescript
    schedule: { interval: weekly }
    groups:
      node: { patterns: ["*"] }
  - package-ecosystem: nuget
    directory: /sdk/dotnet
    schedule: { interval: weekly }
    groups:
      dotnet: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /sdk/go
    schedule: { interval: weekly }
    groups:
      go: { patterns: ["*"] }
