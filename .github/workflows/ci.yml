name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g ajv-cli@5 ajv-formats@3
      - name: Validate schemas are well-formed
        run: |
          set -e
          all="spec/schema/*.json spec/schema/agent-context/*.json conformance/vectors.schema.json"
          for f in $all; do
            # -r must not include the file under -s (ajv rejects duplicate $id)
            refs=$(ls $all | grep -vxF "$f" | sed 's/^/-r /' | tr '\n' ' ')
            ajv compile --spec=draft2020 -c ajv-formats -s "$f" $refs
          done
      - name: Validate vectors against vectors.schema.json
        run: |
          ajv validate --spec=draft2020 -c ajv-formats \
            -s conformance/vectors.schema.json \
            -r 'spec/schema/*.json' \
            -r 'spec/schema/agent-context/*.json' \
            -d 'conformance/vectors/*.json'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v3
      - name: Build native module and install
        # maturin is the PEP 517 build backend; `pip install -e` invokes
        # it automatically. `maturin develop` needs a venv, which the
        # --system install does not have.
        run: uv pip install --system -e ./sdk/python[ctk,dev]
      - run: ruff check sdk/python
      - run: pytest sdk/python/tests -p no:agent_hooks_ctk -v

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm run build:native:debug
        working-directory: sdk/typescript
      - run: npx tsc
        working-directory: sdk/typescript
      - run: node --test test/golden_identity.test.mjs
        working-directory: sdk/typescript

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - run: cargo clippy --workspace --all-features -- -D warnings
        working-directory: sdk/rust
      - run: cargo test --workspace --all-features
        working-directory: sdk/rust

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ffi cdylib
        run: cargo build -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet build -warnaserror
        working-directory: sdk/dotnet
      - name: Test (golden identity)
        run: dotnet test test/AgentHooks.Tests/ --nologo
        working-directory: sdk/dotnet
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ffi cdylib
        run: cargo build -p agent-hooks-ffi --release
        working-directory: sdk/rust
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Build and test
        run: |
          go build ./...
          go vet ./...
          go test ./... -v
        working-directory: sdk/go
        env:
          CGO_LDFLAGS: -L${{ github.workspace }}/sdk/rust/target/release -lagent_hooks_ffi
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/rust/target/release
